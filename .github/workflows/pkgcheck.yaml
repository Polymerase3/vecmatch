name: pkgcheck

# This will cancel running jobs once a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  # Manually trigger the Action under Actions/pkgcheck
  workflow_dispatch:
  # Run after R-CMD-check concludes on main, so pkgcheck's CI check reads a
  # finished R-CMD-check run instead of an in-progress one (conclusion: null)
  workflow_run:
    workflows: ["R-CMD-check"]
    branches: [main]
    types:
      - completed

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: ropensci-review-tools/pkgcheck-action@main
